server:
  port: ${PORT:8193}
  servlet:
    context-path: /lista

spring:
  application:
    name: lista
  profiles:
    active: dev

  # Configurações de Banco de Dados e JPA (Suportado pelo core-jpa)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/glaiss?currentSchema=gl_lista&TimeZone=America/Sao_Paulo}
    username: ${USER_DB:gl_lista_app}
    password: ${PASSWORD_DB:gl_lista}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gl_lista
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: gl_lista
    user: ${USER_DB_FLYWAY:gl_lista}
    password: ${PASSWORD_DB_FLYWAY:gl_lista}

  # Configurações de Serialização (Suportado pelo core-common)
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    deserialization:
      fail-on-unknown-properties: false

  # Desabilitar Discovery e Gateway Interno (Arquitetura Simplificada)
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false

  feign:
    client:
      enabled: false

  cache:
    type: ${CACHE_TYPE:simple}

# Configurações de Segurança (Suportado pelo core-security)
security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

# Observabilidade e Actuator (JSON para CloudWatch já configurado no logback)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.glaiss: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

# Integrações Diretas (Sem Discovery)
api:
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8195/notification}
  users:
    url: ${USERS_SERVICE_URL:http://localhost:8197/users}

# Configurações de CORS e App
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
