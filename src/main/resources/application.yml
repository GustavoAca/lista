server:
  port: ${PORT:8193}
  servlet:
    context-path: /lista

spring:
  application:
    name: lista
    version: @project.version@
  profiles:
    active: dev

  # Configurações de Banco de Dados e JPA (Suportado pelo core-jpa)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/glaiss?currentSchema=gl_lista&TimeZone=America/Sao_Paulo}
    username: ${USER_DB:gl_lista_app}
    password: ${PASSWORD_DB:gl_lista}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gl_lista
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: gl_lista
    user: ${USER_DB_FLYWAY:gl_lista}
    password: ${PASSWORD_DB_FLYWAY:gl_lista}
    baseline-on-migrate: true

  # Configurações de Serialização (Suportado pelo core-common)
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    deserialization:
      fail-on-unknown-properties: false

  # Desabilitar Discovery e Gateway Interno (Arquitetura Simplificada)
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false

  feign:
    client:
      enabled: false

  cache:
    type: ${CACHE_TYPE:simple}

jwt:
  public:
    key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxyxs9a0bpYdH9x2hfjNS
      yNnz4FXmSpPz9CRLbtVlvghnZ4G9HB3Z++Z2HfpLIPahoCyp+Bi8b9gmDue3qRAn
      cSNH16LCcNrOYFapz9MoW3U6ijOKZJsowdWDnHY8e3FjSBTw5s4X9c2wha2v9Erj
      QNYdIIDXmqWoWm2206MsDzbwQ4bQo69/zMYU0xUmI0ZQViYVa6DVvXXZrYyyLNOv
      JrSxF+Fs3fN3Mv6/rELmwrR9KJNL+NaKuQW7BDV8L0f5m6davtQwzSmwkR+BlT97
