# Configurações Específicas da Aplicação
servico-externos-permitidos: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
eureka:
  client:
    enabled: false

# Observabilidade e Actuator (JSON para CloudWatch já configurado no logback)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.glaiss: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

# Integrações Diretas (Sem Discovery)
api:
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8195/notification}
  users:
    url: ${USERS_SERVICE_URL:http://localhost:8197/users}

# Configurações de CORS e App
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
